avilist = "AviList v2026"

[scope]
geographic_scope = "Kenya, East Africa: terrestrial, inland freshwater, and coastal environments, together with offshore and marine records included in the Kenya coverage of the source eBird Basic Dataset. Checklist membership concerns birds recorded within this national scope, including residents, migrants, vagrants, naturalized species, and historical records. Inclusion does not imply occurrence throughout Kenya. The marine scope follows the source dataset's assignment of records to Kenya; an independently delineated Exclusive Economic Zone boundary is not supplied with this checklist."
sensitive_record_limitation = "Taita Falcon and Saker Falcon are retained through curated membership because their observation evidence is withheld from the public EBD."

[scope.geographic_bounds]
west = 33.943264
east = 42.4992619
north = 4.6900784
south = -4.789943
source_ebd_version = "2026-06"
supporting_records = 4636644
description = "Previous v2026.0 evidence extent; recalculate for v2026.1 after the official taxonomy CSV is available. Bounding box of all supporting EBD records matched through the release checklist's source_avibase_ids, excluding escapees after applying release exotic-code overrides. This is the observed evidence extent, including marine records, not Kenya's political boundary or a delineation of its EEZ. Recalculate when the source evidence changes."

