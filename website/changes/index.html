<head>

  <meta name="description" content="Compare the Birds of Kenya checklist {{FROM_YEAR}} with {{CHECKLIST_YEAR}}.">
  <meta name="theme-color" content="#173e2e">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">

<body data-site-root="../">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="../">Birds of Kenya</a>
    <div class="nav-links"><a href="../">Home</a><a href="../checklist/">Table</a><a href="../tree/">Tree</a><a href="../explore/">Explore</a><a href="./" aria-current="page">Changes</a></div>

  <header class="page-hero changes-hero">
    <div>
      <h1>Taxonomic changes</h1>
      <p class="lede">Compare any two versions of the checklist.</p>
      <div class="comparison-selectors"><label>From <select id="fromVersion"></select></label><label>To <select id="toVersion"></select></label>
        <a class="hero-link primary" id="comparisonCsv" href="#">Download changes CSV <span aria-hidden="true">↓</span></a>
      </div>
    </div>
  </header>

  <div class="changes-toolbar-wrap">
    <div class="changes-toolbar">
      <div class="top-controls"><label class="sr-only" for="changeSearch">Search taxonomy changes</label><input id="changeSearch" type="search" placeholder="Search names, families, or Avibase IDs"><button class="clear-filters" id="clearChangeFilters" type="button">Clear filters</button></div>
      <div class="change-filter-strip">
      <div class="filter-row" id="nameFilters"><span class="filter-label">Changed field</span></div>
      <div class="filter-row" id="conceptFilters"><span class="filter-label">Concept change</span></div>
      </div>
    </div>
  </div>

  <main class="changes-main">
    <div id="changeError" class="message error" hidden></div>
    <div id="changeReport"></div>
  </main>

  <footer class="site-footer"><p class="footer-title">Birds of Kenya · <span data-site="release.year">{{CHECKLIST_YEAR}}</span></p><nav aria-label="Footer navigation"><a href="../">Home</a><a href="../checklist/">Table</a><a href="../tree/">Tree</a><a href="../explore/">Explore</a><a href="./">Changes</a><a href="../policy/">Policy</a><a href="https://github.com/A-Rocha-Kenya/Birds-of-Kenya" target="_blank" rel="noreferrer">Repository <span aria-hidden="true">↗</span></a></nav></footer>
