<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Evolutionary tree · Birds of Kenya</title>
  <meta name="description" content="How the bird species of Kenya are related: an interactive, dated evolutionary tree.">
  <meta name="theme-color" content="#173e2e">
  <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body data-release-id="{{RELEASE_ID}}" class="taxonomy-page tree-page" data-taxonomy-page="tree" data-site-root="../">
  <nav class="site-nav" aria-label="Main navigation">
    <a class="brand" href="../">Birds of Kenya</a>
    <div class="nav-links"><a href="../">Home</a><a href="../checklist/">Table</a><a href="./" aria-current="page">Tree</a><a href="../explore/">Explore</a><a href="../changes/">Changes</a></div>
  </nav>

  <header class="page-hero">
    <div>
      <h1>Evolutionary tree</h1>
      <p class="lede">How Kenya’s birds are related, from the dated tree of all birds.</p>
    </div>
  </header>

  <div class="taxonomy-toolbar-wrap">
    <div class="tree-toolbar" aria-label="Tree controls">
      <div class="explore-search tree-search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
        <label class="sr-only" for="treeSearch">Find a species in the tree</label>
        <input id="treeSearch" type="search" list="treeSpecies" placeholder="Find a species in the tree" autocomplete="off" spellcheck="false">
        <datalist id="treeSpecies"></datalist>
      </div>
      <div class="fold-switch" role="group" aria-label="Fold the tree">
        <span class="filter-label">Show</span>
        <button type="button" data-fold="orders">Orders</button>
        <button type="button" data-fold="families">Families</button>
        <button type="button" data-fold="species">All species</button>
      </div>
      <label class="sci-toggle"><input id="showScientific" type="checkbox"> Scientific names</label>
    </div>
  </div>

  <div id="loader" class="taxonomy-loader" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span>Loading…</div>
  <div id="error" class="message error" role="alert" hidden></div>

  <main id="treeView" class="time-tree-view" aria-label="Evolutionary tree of Kenya’s birds" hidden>
    <div class="time-axis" id="timeAxis" aria-hidden="true"></div>
    <div id="timeTree" class="time-tree"></div>
    <p class="tree-source" id="treeSource"></p>
  </main>

  <footer class="site-footer">
    <p class="illustration-credit" id="illustrationCredit"></p>
    <p class="footer-title">Birds of Kenya · <span data-site="release.year">{{CHECKLIST_YEAR}}</span></p><nav aria-label="Footer navigation"><a href="../">Home</a><a href="../checklist/">Table</a><a href="./">Tree</a><a href="../explore/">Explore</a><a href="../changes/">Changes</a><a href="../policy/">Policy</a><a href="https://github.com/A-Rocha-Kenya/Birds-of-Kenya" target="_blank" rel="noreferrer">Repository <span aria-hidden="true">↗</span></a></nav>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script><script src="../assets/site.js"></script><script src="../assets/taxonomy.js"></script>
</body>
</html>
